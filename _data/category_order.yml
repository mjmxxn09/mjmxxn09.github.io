# 카테고리 페이지에 보일 순서
# 글의 categories 값과 철자·대소문자가 똑같아야 해요.
# 여기에 없는 카테고리는 가나다/알파벳순으로 뒤에 붙어요.
#
# 글 머리말(front matter) 예시
#   개발 > Backend > C언어      categories: [개발, Backend, C언어]
#   개발 > Backend > Java       categories: [개발, Backend, Java]
#   개발 > Frontend > React     categories: [개발, Frontend, React]
#   개발 > App > Flutter        categories: [개발, App, Flutter]
#   시험 > 정보처리기사          categories: [시험, 정보처리기사]
#   정리                        categories: [정리]

# 상위
- 개발
- 시험
- 정리

# 개발 아래
- Backend
- Frontend
- App

# Backend 아래
- C언어
- Java

# Frontend 아래
- React

# App 아래
- Flutter

# 시험 아래
- 정보처리기사
